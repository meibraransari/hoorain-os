<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6c63ff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Outer Glass Ring -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="8" />

  <!-- Financial Chart Bars forming part of the H monogram -->
  <!-- Left Pillar -->
  <rect x="128" y="140" width="56" height="232" rx="28" fill="url(#whiteGrad)" />

  <!-- Right Pillar (Ascending Growth) -->
  <rect x="328" y="100" width="56" height="272" rx="28" fill="url(#whiteGrad)" />

  <!-- Horizontal Crossbar (Accounting Ledger Bridge) -->
  <rect x="170" y="240" width="172" height="44" rx="22" fill="url(#goldGrad)" />

  <!-- Rising Trend Curve / Arrow Spark -->
  <path d="M 120 340 Q 240 310 390 120" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" />
  <polygon points="390,105 395,145 355,120" fill="url(#goldGrad)" />

  <!-- Currency / Ledger Dots -->
  <circle cx="256" cy="160" r="18" fill="url(#goldGrad)" />
</svg>
