version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    container_name: hoorain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hoorainos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hoorainos}
    volumes:
      - ${DATA_FOLDER:-./data}/postgres:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # Internal traffic only — port exposed for admin access if needed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hoorainos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hoorain-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: hoorain-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${DATA_FOLDER:-./data}/redis:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # Internal traffic only
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hoorain-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hoorain-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_HOST: ${DATABASE_HOST:-postgres}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USER: ${POSTGRES_USER:-hoorainos}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-hoorainos}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-30d}
      UPLOAD_PATH: ${UPLOAD_PATH:-/app/uploads}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-50mb}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${DATA_FOLDER:-./data}/uploads:/app/uploads
      - ${BACKUP_PATH:-./backups}:/app/backups
      - ./imports:/app/imports
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    # Access via Nginx; port also exposed for direct admin access if needed
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - hoorain-network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hoorain-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      BACKEND_URL: http://${BACKEND_HOST:-backend}:3001
      HOSTNAME: ${FRONTEND_HOSTNAME:-0.0.0.0}
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    # Also accessed via Nginx; port exposed for direct access if needed
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - hoorain-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    container_name: hoorain-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_PORT_SSL:-443}:443"
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DATA_FOLDER:-./data}/nginx/logs:/var/log/nginx
      - ${SSL_CERT_PATH:-./ssl}/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - ${SSL_CERT_PATH:-./ssl}/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      - ${SSL_CERT_PATH:-./ssl}/chain.pem:/etc/nginx/ssl/chain.pem:ro
    networks:
      - hoorain-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"

  # Daily automated database backup service
  pgbackup:
    image: postgres:17-alpine
    container_name: hoorain-pgbackup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-hoorainos}
      POSTGRES_DB: ${POSTGRES_DB:-hoorainos}
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-30}
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
      - ./scripts/pgbackup-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - hoorain-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

networks:
  hoorain-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
