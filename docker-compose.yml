services:
  postgres:
    image: postgres:17-alpine
    container_name: hoorain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financeos_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-financeos}
    volumes:
      - ${DATA_FOLDER:-./data}/postgres:/var/lib/postgresql/data
      - ${BACKUP_PATH:-./backups}:/var/lib/postgresql/backups
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financeos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hoorain-network

  redis:
    image: redis:7-alpine
    container_name: hoorain-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret_2024}
    volumes:
      - ${DATA_FOLDER:-./data}/redis:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_secret_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hoorain-network

  backend:
    image: ibraransaridocker/hoorain-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hoorain-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-financeos}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-financeos_secret_2024}
      DATABASE_NAME: ${POSTGRES_DB:-financeos}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret_2024}
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret}
      JWT_EXPIRY: ${JWT_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-30d}
      UPLOAD_PATH: /app/uploads
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-50mb}
    volumes:
      - ${DATA_FOLDER:-./data}/uploads:/app/uploads
      - ${BACKUP_PATH:-./backups}:/app/backups
      - ./imports:/app/imports
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hoorain-network

  frontend:
    image: ibraransaridocker/hoorain-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hoorain-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      BACKEND_URL: http://backend:3001
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - hoorain-network

  nginx:
    image: nginx:alpine
    container_name: hoorain-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DATA_FOLDER:-./data}/nginx/logs:/var/log/nginx
    networks:
      - hoorain-network

networks:
  hoorain-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
